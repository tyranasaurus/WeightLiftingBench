schema_version = "1.3"
artifacts = ["/app/out"]

[task]
name = "wsp/diagnose-public-checkpoint-mcq-08572485"
description = "wsp diagnose track on public-checkpoint-mcq"

[metadata]
track = "diagnose"
target = "public-checkpoint-mcq"
access = "read: api_wsp, up to 30 python cells (numpy, no network, no API keys)"
reward_definition = "1 if the last ANSWER: line is an accepted name (wsp.harbor.answer_grader), else 0"

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "openrouter.ai"]

[verifier]
timeout_sec = 120.0
network_mode = "no-network"
environment_mode = "shared"

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1200.0
workdir = "/app"
