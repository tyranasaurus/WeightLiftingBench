[project]
name = "wsc-bench"
version = "1.0.0"
description = "Weight Space Compilation Bench: models write the weights of a ReLU network by hand, in one reply."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "chess>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wsc-bench = "wsc_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsc_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
