schema_version = "1.3"
artifacts = ["/app/out/build.py", "/app/out/network.json", "/app/out/method.md", "/app/out/checks.log"]

[task]
name = "wsp/clothing-nocopy100-design-slim"
description = "clothing: the model designs a network from eight building blocks and writes its weights; up to 100 training examples per class to look at; no copying or fitting: build.py must rebuild the weights with no data; at most 5 checks on training images; slim: weights.npz is regenerated from build.py by the scorer instead of being carried"

[metadata]
track = "write"
target = "clothing-nocopy100-design-slim"
access = "100 examples per class; arm design"
experiment = "clothing-nocopy100-design-slim"
reward_reference = 0.9481
reward_definition = "skill = (accuracy - 1/K) / (1 - 1/K) on the full official test set, floored at 0 for reward"

[agent]
timeout_sec = 5400.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "openrouter.ai"]

[verifier]
timeout_sec = 3600.0
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 8192
storage_mb = 10240
build_timeout_sec = 1200.0

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 10240
build_timeout_sec = 1200.0
workdir = "/app"
