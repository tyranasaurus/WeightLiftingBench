schema_version = "1.3"
artifacts = ["/app/out"]

[task]
name = "wsp/galaxies-nocopy10-program"
description = "galaxies: the model writes a deterministic program; 10 training examples per class to look at; no copying or fitting: build.py must rebuild solution.py with no data; at most 5 checks on training images"

[metadata]
track = "write_program"
target = "galaxies-nocopy10-program"
access = "10 examples per class; arm program"
experiment = "galaxies-nocopy10-program"
reward_reference = 0.8239
reward_definition = "skill = (accuracy - 1/K) / (1 - 1/K) on the full official test set, floored at 0 for reward"

[agent]
timeout_sec = 5400.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "openrouter.ai"]

[verifier]
timeout_sec = 3600.0
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 8192
storage_mb = 10240
build_timeout_sec = 1200.0

[environment]
cpus = 4
memory_mb = 8192
storage_mb = 10240
build_timeout_sec = 1200.0
workdir = "/app"
